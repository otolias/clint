name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Build executable
        run: zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-linux-musl

      - name: Rename binary
        run: mv zig-out/bin/clint zig-out/bin/clint-${{ github.ref_name }}-linux-x86_64-musl

      - name: Create Github Release
        uses: softprops/action-gh-release@v2
        with:
          files: zig-out/bin/clint-${{ github.ref_name }}-linux-x86_64-musl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
